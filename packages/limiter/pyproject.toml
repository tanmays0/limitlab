[project]
name = "limitlab-limiter"
version = "0.1.0"
description = "LimitLab rate-limit algorithms and Redis Lua helpers"
requires-python = ">=3.12"
dependencies = [
  "redis>=5.0.0",
  "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/limitlab_limiter"]

[tool.hatch.build.targets.wheel.force-include]
"src/limitlab_limiter/lua/token_bucket.lua" = "limitlab_limiter/lua/token_bucket.lua"
"src/limitlab_limiter/lua/sliding_window.lua" = "limitlab_limiter/lua/sliding_window.lua"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
